[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starlightpy"
version = "1.0.0"
description = "Python library for STARLIGHT-style galaxy continuum fitting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
]

[project.optional-dependencies]
ppxf = ["ppxf>=9.0"]
fits = ["astropy>=5.0"]
dust = ["dust_extinction"]
dev = ["pytest>=7", "ppxf>=9.0", "astropy>=5.0", "dust_extinction"]

[project.urls]
Homepage = "https://github.com/Babapei/starlightpy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
